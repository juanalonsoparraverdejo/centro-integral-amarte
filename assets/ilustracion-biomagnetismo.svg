    <linearGradient id="linen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffdf9"/><stop offset="1" stop-color="#e8e0d7"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e7bba0"/><stop offset="1" stop-color="#c98d70"/></linearGradient>
