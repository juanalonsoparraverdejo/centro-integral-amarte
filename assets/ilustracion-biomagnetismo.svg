<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Ilustración referencial de una sesión de biomagnetismo</title>
  <desc id="desc">Persona recostada mientras una terapeuta coloca un par de imanes rojos y negros sobre el cuerpo.</desc>
