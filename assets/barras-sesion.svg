<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Mapa de puntos de Barras de Access sobre la cabeza">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6efe5"/>
      <stop offset="1" stop-color="#d3e6e3"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f4dca5" stop-opacity=".85"/>
      <stop offset=".5" stop-color="#d9bfd0" stop-opacity=".4"/>
      <stop offset="1" stop-color="#d9bfd0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hair" cx="45%" cy="38%" r="70%">
      <stop offset="0" stop-color="#6b4c5b"/>
      <stop offset="1" stop-color="#3a2631"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe9b0" stop-opacity=".95"/>
      <stop offset="1" stop-color="#e2b45a" stop-opacity="0"/>
    </radialGradient>
    <g id="dot">
      <circle r="17" fill="url(#glow)"/>
      <circle r="6.5" fill="#f8dc93" stroke="#c99a3d" stroke-width="1.5"/>
    </g>
    <path id="spark" d="M0 -15 L4 -4 L15 0 L4 4 L0 15 L-4 4 L-15 0 L-4 -4 Z"/>
    <g id="head">
      <ellipse cx="-142" cy="10" rx="14" ry="36" fill="#e3c3ab"/>
      <ellipse cx="142" cy="10" rx="14" ry="36" fill="#e3c3ab"/>
      <ellipse rx="140" ry="175" fill="url(#hair)"/>
      <ellipse cx="-30" cy="-80" rx="70" ry="50" fill="#fff" fill-opacity=".08"/>
      <g stroke="#e2b45a" stroke-opacity=".5" stroke-width="1.5" fill="none">
        <path d="M0 -130V120"/>
        <path d="M-45 -115V105"/><path d="M45 -115V105"/>
        <path d="M-90 -90V105"/><path d="M90 -90V105"/>
        <path d="M-125 -55V55"/><path d="M125 -55V55"/>
      </g>
      <use xlink:href="#dot" x="0" y="-130"/><use xlink:href="#dot" x="0" y="-80"/><use xlink:href="#dot" x="0" y="-30"/>
      <use xlink:href="#dot" x="0" y="20"/><use xlink:href="#dot" x="0" y="70"/><use xlink:href="#dot" x="0" y="120"/>
      <use xlink:href="#dot" x="-45" y="-115"/><use xlink:href="#dot" x="-45" y="-60"/><use xlink:href="#dot" x="-45" y="-5"/>
      <use xlink:href="#dot" x="-45" y="50"/><use xlink:href="#dot" x="-45" y="105"/>
      <use xlink:href="#dot" x="45" y="-115"/><use xlink:href="#dot" x="45" y="-60"/><use xlink:href="#dot" x="45" y="-5"/>
      <use xlink:href="#dot" x="45" y="50"/><use xlink:href="#dot" x="45" y="105"/>
      <use xlink:href="#dot" x="-90" y="-90"/><use xlink:href="#dot" x="-90" y="-25"/>
      <use xlink:href="#dot" x="-90" y="40"/><use xlink:href="#dot" x="-90" y="105"/>
      <use xlink:href="#dot" x="90" y="-90"/><use xlink:href="#dot" x="90" y="-25"/>
      <use xlink:href="#dot" x="90" y="40"/><use xlink:href="#dot" x="90" y="105"/>
      <use xlink:href="#dot" x="-125" y="-55"/><use xlink:href="#dot" x="-125" y="-20"/>
      <use xlink:href="#dot" x="-125" y="20"/><use xlink:href="#dot" x="-125" y="55"/>
      <use xlink:href="#dot" x="125" y="-55"/><use xlink:href="#dot" x="125" y="-20"/>
      <use xlink:href="#dot" x="125" y="20"/><use xlink:href="#dot" x="125" y="55"/>
    </g>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="315" r="310" fill="url(#aura)"/>
  <g fill="none" stroke="#1f7a80" stroke-opacity=".22" stroke-width="2">
    <circle cx="600" cy="315" r="235"/>
    <circle cx="600" cy="315" r="275"/>
    <circle cx="600" cy="315" r="315" stroke-opacity=".12"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-width="3">
    <path d="M40 470 C220 360 330 560 470 430" stroke="#806174" stroke-opacity=".35"/>
    <path d="M60 420 C230 320 340 500 465 390" stroke="#1f7a80" stroke-opacity=".3"/>
    <path d="M1160 470 C980 360 870 560 730 430" stroke="#806174" stroke-opacity=".35"/>
    <path d="M1140 420 C970 320 860 500 735 390" stroke="#1f7a80" stroke-opacity=".3"/>
  </g>

  <g fill="#d6a94f" fill-opacity=".8">
    <use xlink:href="#spark" x="180" y="150"/>
    <use xlink:href="#spark" x="1040" y="115"/>
    <use xlink:href="#spark" x="965" y="530"/>
    <use xlink:href="#spark" x="235" y="510"/>
  </g>

  <use xlink:href="#head" transform="translate(600 315)"/>
